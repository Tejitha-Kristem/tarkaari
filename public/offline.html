<!doctype html>
<html lang="kn-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f3d32">
  <title>Tarkaari · ತರಕಾರಿ</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 24px; padding: 24px; box-sizing: border-box; background: #f5f7f4; color: #10231d; text-align: center;
           font-family: "Noto Sans Kannada", "Noto Sans", system-ui, sans-serif; font-size: 20px; line-height: 1.5; }
    .icon { width: 96px; height: 96px; border-radius: 24px; }
    h1 { font-size: 28px; margin: 0; }
    p { margin: 0; color: #5f5f5f; }
    hr { width: 60%; border: 0; border-top: 2px solid #ececec; }
    button { height: 64px; width: 100%; max-width: 420px; border: 0; border-radius: 999px; background: #b9eb6e; color: #0f3d32; font-weight: 600;
             font: inherit; font-weight: 700; font-size: 22px; display: inline-flex; align-items: center; justify-content: center; gap: 12px; }
  </style>
</head>
<body>
  <img class="icon" src="/icons/icon-192.png" alt="">
  <div>
    <h1>ಇಂಟರ್ನೆಟ್ ಇಲ್ಲ</h1>
    <p>ಮೊಬೈಲ್ ಡೇಟಾ ಅಥವಾ ವೈ-ಫೈ ಪರಿಶೀಲಿಸಿ, ನಂತರ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.</p>
  </div>
  <hr>
  <div lang="en-IN">
    <h1>No internet</h1>
    <p>Check your mobile data or Wi-Fi, then try again.</p>
  </div>
  <button type="button" onclick="location.reload()">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ / Try again
  </button>
</body>
</html>
